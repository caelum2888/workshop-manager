{% extends "base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="page-head"><h1>Alterar minha senha</h1></div>

<section class="card" style="max-width:420px">
  <form id="passwordForm">
    <div class="notice notice-bad form-error" role="alert" hidden></div>
    <label class="field"><span>Senha atual</span><input name="current_password" type="password" required autocomplete="current-password"></label>
    <label class="field"><span>Nova senha</span><input name="new_password" type="password" required minlength="8" autocomplete="new-password"></label>
    <label class="field"><span>Confirmar nova senha</span><input name="confirm_password" type="password" required minlength="8" autocomplete="new-password"></label>
    <div class="btn-row"><button class="btn btn-primary" type="submit">Salvar nova senha</button></div>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script>
const $ = (id) => document.getElementById(id);
const form = $("passwordForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  App.clearFormErrors(form);
  const body = App.formData(form);
  if (body.new_password !== body.confirm_password) {
    App.showFormErrors(form, { message: "A confirmação não bate com a nova senha." });
    return;
  }
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true;
  btn.textContent = "Salvando…";
  try {
    await App.api("POST", "/api/me/password", body);
    form.reset();
    App.toast("Senha alterada com sucesso.");
  } catch (err) {
    App.showFormErrors(form, err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Salvar nova senha";
  }
});
</script>
{% endblock %}
